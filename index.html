<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Upload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --ink-2:#222E3E;
    --panel:#26313F;
    --paper:#F3EEE3;
    --paper-dim:#E4DDCC;
    --brass:#C89B3C;
    --brass-bright:#E0B65A;
    --steel:#8494A6;
    --steel-dim:#4E5C6E;
    --good:#6FA287;
    --bad:#C0665A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, rgba(200,155,60,0.08), transparent 55%),
      var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--brass); color:var(--ink);}

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 18px 80px;
  }

  /* ---- Header: station signage board ---- */
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--steel-dim);
    padding-bottom:14px;
    margin-bottom:28px;
  }
  .brand{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:clamp(26px, 6vw, 34px);
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--paper);
  }
  .brand span{color:var(--brass);}
  .tagline{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--steel);
    text-transform:uppercase;
    letter-spacing:1.5px;
  }

  /* ---- Dropzone: the locker slot ---- */
  .locker{
    position:relative;
    border:2px dashed var(--steel-dim);
    border-radius:var(--radius);
    background:var(--ink-2);
    padding:36px 20px;
    text-align:center;
    transition:border-color .18s ease, background .18s ease;
    cursor:pointer;
  }
  .locker.drag{
    border-color:var(--brass);
    background:rgba(200,155,60,0.06);
  }
  .locker:focus-visible{
    outline:2px solid var(--brass-bright);
    outline-offset:3px;
  }
  .slot-icon{
    width:46px; height:46px;
    margin:0 auto 14px;
    color:var(--brass);
  }
  .locker h2{
    font-family:'Oswald', sans-serif;
    font-weight:500;
    font-size:19px;
    margin:0 0 6px;
    letter-spacing:0.3px;
  }
  .locker p{
    margin:0;
    font-size:13px;
    color:var(--steel);
  }
  .locker input[type=file]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }
  .limit-note{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--steel-dim);
    margin-top:9px;
    letter-spacing:0.3px;
  }

  /* ---- Section label ---- */
  .section-label{
    display:flex;
    align-items:center;
    gap:10px;
    margin:34px 0 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--steel);
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--steel-dim);
  }
  .count-badge{
    font-family:'IBM Plex Mono', monospace;
    background:var(--steel-dim);
    color:var(--paper);
    border-radius:20px;
    padding:1px 8px;
    font-size:10.5px;
  }

  /* ---- File tickets ---- */
  #list{display:flex; flex-direction:column; gap:12px;}

  .ticket{
    display:flex;
    align-items:stretch;
    background:var(--paper);
    color:var(--ink);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.25);
    animation:settle .35s ease;
  }
  @keyframes settle{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .ticket-main{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 12px 14px 16px;
  }
  .file-icon{
    flex-shrink:0;
    width:34px; height:34px;
    color:var(--ink);
    opacity:0.75;
  }
  .file-meta{min-width:0;}
  .file-name{
    font-weight:600;
    font-size:14.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .file-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:#5B6672;
    margin-top:2px;
    letter-spacing:0.2px;
  }

  .perforation{
    width:0;
    border-left:2px dashed var(--paper-dim);
    position:relative;
  }
  .perforation::before,.perforation::after{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:14px; height:14px;
    background:var(--ink);
    border-radius:50%;
  }
  .perforation::before{top:-7px;}
  .perforation::after{bottom:-7px;}

  .ticket-actions{
    display:flex;
    flex-direction:column;
    flex-shrink:0;
  }
  .tbtn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:54px;
    border:none;
    background:transparent;
    cursor:pointer;
    color:var(--ink);
    transition:background .15s ease;
  }
  .tbtn svg{width:19px; height:19px;}
  .tbtn.download{background:var(--brass); color:var(--ink);}
  .tbtn.download:hover{background:var(--brass-bright);}
  .tbtn.delete{color:#9AA3AD;}
  .tbtn.delete:hover{color:var(--bad); background:rgba(192,102,90,0.08);}

  /* ---- Empty state ---- */
  .empty{
    text-align:center;
    padding:30px 10px 6px;
    color:var(--steel);
    font-size:13.5px;
    line-height:1.6;
  }
  .empty b{color:var(--paper); display:block; font-family:'Oswald',sans-serif; font-weight:500; font-size:15px; margin-bottom:4px;}

  /* ---- Toast ---- */
  #toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel);
    border:1px solid var(--steel-dim);
    color:var(--paper);
    padding:11px 18px;
    border-radius:8px;
    font-size:13px;
    max-width:88vw;
    text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast.err{border-color:var(--bad);}
  #toast.ok{border-color:var(--good);}

  @media (prefers-reduced-motion: reduce){
    .ticket{animation:none;}
    #toast{transition:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand">Meu<span>Upload</span></div>
        <div class="tagline">deixe aqui &middot; pegue de qualquer lugar</div>
      </div>
    </header>

    <div class="locker" id="dropzone" tabindex="0" role="button" aria-label="Adicionar arquivo">
      <svg class="slot-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 6v22M24 6l-8 8M24 6l8 8"/>
        <path d="M8 30v8a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4v-8"/>
      </svg>
      <h2 id="dz-title">Solte um arquivo aqui</h2>
      <p>ou toque para escolher do seu dispositivo</p>
      <input type="file" id="fileInput" multiple aria-label="Escolher arquivo">
    </div>
    <div class="limit-note">limite de 3,5&nbsp;MB por arquivo &middot; salvo na sua conta</div>

    <div class="section-label">Guardados <span class="count-badge" id="countBadge">0</span></div>
    <div id="list"></div>
    <div class="empty" id="emptyState">
      <b>O guarda-volumes está vazio</b>
      Solte um arquivo acima para começar a guardar.
    </div>
  </div>

  <div id="toast"></div>

<script>
const INDEX_KEY = 'meu-upload:index';
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const listEl = document.getElementById('list');
const emptyState = document.getElementById('emptyState');
const countBadge = document.getElementById('countBadge');
const toastEl = document.getElementById('toast');

const MAX_BYTES = 3.5 * 1024 * 1024; // ~3.5MB raw, keeps base64 under the 5MB key cap

let toastTimer;
function toast(msg, kind){
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.className = 'show' + (kind ? ' ' + kind : '');
  toastTimer = setTimeout(()=> toastEl.className = '', 2600);
}

function formatSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}
function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'}) + ' · ' +
         d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

const ICONS = {
  image: `<path d="M4 6a2 2 0 0 1 2-2h20a2 2 0 0 1 2 2v20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z"/><circle cx="12" cy="13" r="2.3"/><path d="M28 22l-6.5-6.5a2 2 0 0 0-2.8 0L8 26"/>`,
  pdf: `<path d="M9 3h13l7 7v21a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M22 3v7h7"/><path d="M11 22h2.5a2 2 0 0 0 0-4H11v8"/><path d="M18 18v8h2a3 3 0 0 0 3-3v-2a3 3 0 0 0-3-3h-2z"/>`,
  doc: `<path d="M9 3h13l7 7v21a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M22 3v7h7"/><path d="M11 21h14M11 25h14M11 29h9"/>`,
  audio: `<circle cx="10" cy="27" r="3.2"/><circle cx="25" cy="24" r="3.2"/><path d="M13.2 27V9l15-3v18"/>`,
  video: `<rect x="4" y="8" width="24" height="20" rx="2"/><path d="M28 15l8-4v18l-8-4"/>`,
  zip: `<path d="M9 3h20a2 2 0 0 1 2 2v26a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M18 3v4M20 7v4M18 11v4M20 15v4M18 19v4"/><rect x="16" y="23" width="6" height="6" rx="1"/>`,
  generic: `<path d="M9 3h13l7 7v21a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M22 3v7h7"/>`
};
function iconFor(type, name){
  if(type.startsWith('image/')) return ICONS.image;
  if(type === 'application/pdf') return ICONS.pdf;
  if(type.startsWith('audio/')) return ICONS.audio;
  if(type.startsWith('video/')) return ICONS.video;
  if(/\.(zip|rar|7z|tar|gz)$/i.test(name)) return ICONS.zip;
  if(type.includes('word') || /\.(doc|docx|txt|rtf)$/i.test(name)) return ICONS.doc;
  return ICONS.generic;
}

async function loadIndex(){
  try{
    const res = await window.storage.get(INDEX_KEY, false);
    return res ? JSON.parse(res.value) : [];
  }catch(e){
    return [];
  }
}
async function saveIndex(index){
  await window.storage.set(INDEX_KEY, JSON.stringify(index), false);
}

function render(index){
  listEl.innerHTML = '';
  countBadge.textContent = index.length;
  emptyState.style.display = index.length ? 'none' : 'block';

  index.slice().reverse().forEach(item => {
    const ticket = document.createElement('div');
    ticket.className = 'ticket';
    ticket.innerHTML = `
      <div class="ticket-main">
        <svg class="file-icon" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconFor(item.type||'', item.name)}</svg>
        <div class="file-meta">
          <div class="file-name">${escapeHtml(item.name)}</div>
          <div class="file-sub">${formatSize(item.size)} &middot; ${formatDate(item.date)}</div>
        </div>
      </div>
      <div class="perforation"></div>
      <div class="ticket-actions">
        <button class="tbtn download" title="Baixar" aria-label="Baixar ${escapeHtml(item.name)}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M12 15l-4.5-4.5M12 15l4.5-4.5"/><path d="M5 19h14"/></svg>
        </button>
        <button class="tbtn delete" title="Remover" aria-label="Remover ${escapeHtml(item.name)}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7h12z"/></svg>
        </button>
      </div>`;
    ticket.querySelector('.download').addEventListener('click', () => downloadFile(item));
    ticket.querySelector('.delete').addEventListener('click', () => deleteFile(item));
    listEl.appendChild(ticket);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function handleFiles(files){
  let index = await loadIndex();
  for(const file of files){
    if(file.size > MAX_BYTES){
      toast(`"${file.name}" passa do limite de 3,5 MB`, 'err');
      continue;
    }
    dropzone.classList.add('drag');
    document.getElementById('dz-title').textContent = 'Guardando...';
    try{
      const dataUrl = await readAsDataURL(file);
      const id = 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      await window.storage.set('meu-upload:file:' + id, dataUrl, false);
      index.push({id, name: file.name, size: file.size, type: file.type, date: new Date().toISOString()});
      await saveIndex(index);
      render(index);
      toast(`"${file.name}" guardado`, 'ok');
    }catch(e){
      toast(`Não foi possível guardar "${file.name}"`, 'err');
    }
  }
  dropzone.classList.remove('drag');
  document.getElementById('dz-title').textContent = 'Solte um arquivo aqui';
}

function readAsDataURL(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function downloadFile(item){
  try{
    const res = await window.storage.get('meu-upload:file:' + item.id, false);
    if(!res){ toast('Arquivo não encontrado', 'err'); return; }
    const a = document.createElement('a');
    a.href = res.value;
    a.download = item.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){
    toast('Erro ao baixar o arquivo', 'err');
  }
}

async function deleteFile(item){
  try{
    await window.storage.delete('meu-upload:file:' + item.id, false);
    let index = await loadIndex();
    index = index.filter(f => f.id !== item.id);
    await saveIndex(index);
    render(index);
    toast(`"${item.name}" removido`);
  }catch(e){
    toast('Erro ao remover o arquivo', 'err');
  }
}

fileInput.addEventListener('change', e => {
  if(e.target.files.length) handleFiles(e.target.files);
  fileInput.value = '';
});
dropzone.addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fileInput.click(); }
});
['dragenter','dragover'].forEach(evt => dropzone.addEventListener(evt, e => {
  e.preventDefault(); dropzone.classList.add('drag');
}));
['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, e => {
  e.preventDefault();
  if(evt === 'drop' && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  dropzone.classList.remove('drag');
}));

(async function init(){
  try{
    const index = await loadIndex();
    render(index);
  }catch(e){
    render([]);
  }
})();
</script>
</body>
</html>
